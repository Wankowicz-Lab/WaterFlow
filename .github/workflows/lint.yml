name: Lint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting and lint
        run: |
          ruff check .
          ruff format --check .

  ty:
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - uses: actions/checkout@v6

      - name: Setup UV and python version
        uses: astral-sh/setup-uv@v7

      - name: Run ty
        run: uvx ty check src/
